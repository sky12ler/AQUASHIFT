    function evaluate(x=current(),jobKey=state.job){const j=jobs[jobKey],thermal=Math.max(0,x.temp-30)*118,reusePenalty=(100-x.reuse)*7.2,demand=Math.round((4300+thermal+reusePenalty+j.water)/10)*10;let capacity=8000-(100-x.tank)*9-(x.community==='watch'?320:x.community==='restriction'?900:x.community==='emergency'?1700:0)-(x.leak==='watch'?360:x.leak==='high'?1450:0);capacity=Math.round(capacity/10)*10;const expected=Math.round((4850+thermal*.55+Math.max(0,50-x.reuse)*5)/10)*10,residual=x.makeup-expected,leakHigh=x.leak==='high'||residual>state.settings.leakResidual,unsafe=demand>capacity||x.tank<state.settings.minTank||x.community==='emergency',projected=demand>capacity-450||x.temp>=40;let decision='RUN NOW',reason='Water and compute capacity remain safe through the full workload window.',start='Now';if(j.critical&&(unsafe||leakHigh||projected)&&!x.alt){decision='ESCALATE';reason='Critical workload has no site satisfying water, infrastructure and SLA constraints.'}else if(j.critical&&(unsafe||leakHigh||projected)&&x.alt){decision='MOVE SITE';reason='Critical workload cannot delay; an alternative site meets all constraints.';start='17:05'}else if(leakHigh&&x.alt){decision='MOVE SITE';reason='Abnormal water loss derates local capacity; move compute to the verified site.';start='17:05'}else if((unsafe||projected)&&x.alt&&x.community!=='normal'){decision='MOVE SITE';reason='Local water risk is elevated while another site remains feasible.';start='17:05'}else if((unsafe||projected)&&x.future==='better'&&!j.critical){decision='DELAY';reason='A lower-risk water window is forecast before the deadline.';start='22:00'}else if(unsafe||leakHigh||x.community==='restriction'||x.community==='emergency'){decision='LIMIT LOAD';reason='Protect community reserve and stop new flexible workload admission.';start='Hold'}else if(projected&&x.alt){decision='MOVE SITE';reason='Forecast enters the safety margin; another site is lower risk.';start='17:05'}else if(projected){decision='LIMIT LOAD';reason='Forecast enters the safety margin with no safer option.';start='Hold'}const risk=Math.min(99,Math.max(8,Math.round(12+(x.temp-30)*2.1+(100-x.tank)*.26+(100-x.reuse)*.13+(x.community==='watch'?9:x.community==='restriction'?20:x.community==='emergency'?34:0)+(leakHigh?25:x.leak==='watch'?8:0)+(demand>capacity?15:0))));return{j,demand,capacity,balance:capacity-demand,expected,residual,leakHigh,unsafe,projected,decision,reason,start,risk}}
    function spark(color='#00a98f',vals=[4,5,4,6,5,8,6,9]){const mx=Math.max(...vals),mn=Math.min(...vals),p=vals.map((v,i)=>`${i*100/(vals.length-1)},${21-(v-mn)/(mx-mn||1)*17}`).join(' ');return`<svg viewBox="0 0 100 24" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="2"/></svg>`}
    function lineChart(temp=32){const pts=[temp-5,temp-6,temp-5,temp-2,temp+1,temp+2,temp+1,temp+1,temp,temp-2],wet=pts.map(x=>x-6),path=a=>a.map((v,i)=>(i?'L':'M')+(20+i*45)+','+(95-(v-18)*4)).join(' ');return`<svg viewBox="0 0 440 115"><g stroke="#e2ebef">${[25,50,75,100].map(y=>`<line x1="18" y1="${y}" x2="430" y2="${y}"/>`).join('')}</g><path d="${path(pts)}" fill="none" stroke="#177fe5" stroke-width="2.5"/><path d="${path(wet)}" fill="none" stroke="#0aac9e" stroke-width="2.5"/>${['00','04','08','12','16','20'].map((x,i)=>`<text x="${20+i*78}" y="112" font-size="8" fill="#688494">${x}:00</text>`).join('')}</svg>`}
    function demandChart(r=evaluate()){const ds=[.58,.5,.46,.48,.62,.78,.79,.76,.9,.94,.8,.65].map(v=>r.demand*v),cap=Array(12).fill(r.capacity),x=i=>30+i*43,y=v=>145-v/70,path=a=>a.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');return`<svg viewBox="0 0 520 170"><rect x="330" y="10" width="95" height="135" fill="rgba(227,63,79,.08)"/><g stroke="#e2ebef">${[35,70,105,140].map(q=>`<line x1="28" y1="${q}" x2="510" y2="${q}"/>`).join('')}</g><path d="${path(cap)}" fill="none" stroke="#16a05b" stroke-width="2" stroke-dasharray="6 4"/><path d="${path(ds)}" fill="none" stroke="#177fe5" stroke-width="2.5"/>${ds.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#177fe5"/>`).join('')}<text x="345" y="23" font-size="9" fill="#d33e4d">High risk</text></svg>`}

lass="kpi"><span>Pressure</span><b>${s.leak==='high'?112:142} kPa</b><small>${s.leak==='high'?'Low':'Normal'}</small></div></div></section><section class="card"><div class="card-head"><div><h2>◉ Leakage Monitoring</h2><p>Leak sensors and anomaly detection</p></div><select class="select site-select">${siteOptions()}</select></div><div class="card-body"><div class="metric3"><div class="kpi"><span>Leak Sensors</span><b>24</b><small>Online</small></div><div class="kpi"><span>Anomaly</span><b>${r.leakHigh?2:s.leak==='watch'?1:0}</b><small>${r.leakHigh?'High':'Watch'}</small></div><div class="kpi"><span>Critical</span><b>${s.leak==='high'?1:0}</b><small>Leaks</small></div></div>${s.leak!=='none'?`<div class="leak-alert">⚠ Cooling Tower Basin: ${s.leak==='high'?'Leak detected':'Minor anomaly detected'}</div>`:''}<div class="asset-map"><i class="asset-dot" style="left:18%;top:32%"></i><i class="asset-dot" style="left:46%;top:58%;background:${s.leak==='none'?'var(--green)':'var(--amber)'}"></i><i class="asset-dot" style="left:72%;top:28%"></i></div></div></section><section class="card"><div class="card-head"><div><h2>♻ Loss & Reuse Monitoring</h2><p>Water balance and reuse performance</p></div><select class="select site-select">${siteOptions()}</select></div><div class="card-body"><div class="metric3"><div class="kpi"><span>Expected Use</span><b>${Math.round(r.expected/10)} m³/h</b><small>Baseline</small></div><div class="kpi"><span>Actual Use</span><b>${Math.round(s.makeup/10)} m³/h</b><small>${r.residual>0?'↑':'↓'} ${Math.abs(Math.round(r.residual/r.expected*100))}%</small></div><div class="kpi"><span>Total Loss</span><b>${Math.abs(Math.round(r.residual/10))} m³/h</b><small>Residual</small></div></div><div class="reuse"><div class="donut" style="background:conic-gradient(var(--teal) 0 ${s.reuse}%,var(--blue) ${s.reuse}%)"><strong>${s.reuse}%</strong></div><div><div class="mix-row"><span>Reclaimed</span><div class="bar"><i style="width:${s.reuse}%"></i></div><b>${s.reuse}%<     function jobsTable(limit=99){return`<div style="overflow:auto"><table><thead><tr><th>Job ID</th><th>Workload Type</th><th>Site</th><th>Runtime</th><th>Flexibility</th><th>Water Impact</th><th>Deadline</th><th>Recommended Action</th></tr></thead><tbody>${Object.entries(jobs).slice(0,limit).map(([k,j])=>{const rr=evaluate(current(),k);return`<tr class="${state.job===k?'loaded':''}"><td><button class="job-link" data-job="${k}">${j.id}</button></td><td>${j.type}</td><td>${j.site}</td><td>${j.runtime} h</td><td><span class="tag ${j.flex==='High'?'green':j.flex==='Medium'?'amber':'red'}">${j.flex}</span></td><td><span class="tag ${j.impact==='Low'?'green':j.impact==='Medium'?'amber':'red'}">${j.impact}</span></td><td>${j.deadline}</td><td><span class="tag ${rr.decision==='RUN NOW'?'blue':rr.decision==='DELAY'?'amber':rr.decision==='ESCALATE'?'red':'green'}">${rr.decision}</span></td></tr>`}).join('')}</tbody></table></div>`}

etric3"><div class="kpi"><span>Run Now</span><b>842</b><small>67%</small></div><div class="kpi"><span>Delayed</span><b>196</b><small>16%</small></div><div class="kpi"><span>Moved</span><b>127</b><small>10%</small></div><div class="kpi"><span>Limited</span><b>68</b><small>5%</small></div><div class="kpi"><span>Escalated</span><b>15</b><small>1%</small></div><div class="kpi"><span>Water Saved</span><b>14%</b><small>vs baseline</small></div></div></section></div>`}
    function scheduler(){const s=current(),r=evaluate();return pageHead('Workload Scheduler','Simulate water conditions and inspect explainable scheduling decisions')+`<div class="grid2"><section class="card"><div class="card-head"><div><h2>Simulation inputs</h2><p>Changes apply immediately to the scheduler model</p></div><button class="btn" id="reset-sim">Reset to site</button></div><div class="card-body control-grid"><div class="control"><label>Ambient temperature <output>${s.temp}°C</output></label><input data-sim="temp" type="range" min="24" max="44" value="${s.temp}"></div><div class="control"><label>Tank level <output>${s.tank}%</output></label><input data-sim="tank" type="range" min="10" max="100" value="${s.tank}"></div><div class="control"><label>Reclaimed supply <output>${s.reuse}%</output></label><input data-sim="reuse" type="range" min="0" max="100" value="${s.reuse}"></div><div class="control"><label>Makeup flow <output>${fmt.format(s.makeup)} L/h</output></label><input data-sim="makeup" type="range" min="3800" max="9000" step="20" value="${s.makeup}"></div><div class="control"><label>Community condition</label><select data-sim="community">${['normal','watch','restriction','emergency'].map(v=>`<option ${s.community===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="control"><label>Leak signal</label><select data-sim="leak">${['none','watch','high'].map(v=>`<option ${s.leak===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="control"><label>Alternative site</label><select data-sim="alt"><option value="true" ${s.alt?'selected':''}>Available</option><option value="false" ${!s.alt?'selected':''}>Unavailable</option></select></div><div class="control"><label>Future water window</label><select data-sim="future">${['stable','better','poor'].map(v=>`<option ${s.future===v?'selected':''}>${v}</option>`).join('')}</select></div></div></section><section class="decision"><span>Scheduler recommendation · Risk ${r.risk}/100</span><h2>${r.decision}</h2><p>${r.reason}</p><div class="decision-grid"><div><span>Demand</span><b>${fmt.format(r.demand)} L/h</b></div><div><span>Balance</span><b>${r.balance>=0?'+':'−'}${fmt.format(Math.abs(r.balance))} L/h</b></div><div><span>Start</span><b>${r.start}</b></div></div></section></div><div class="grid2 section-gap"><section class="card"><div class="card-head"><div><h2>Forecast water demand</h2><p>Selected job window versus safe capacity</p></div></div><div class="card-body chart">${demandChart(r)}</div></section><section class="card"><div class="card-head"><div><h2>Decision trace</h2><p>Rule and constraint evaluation</p></div></div><div class="card-body">${[['GPU capacity',r.j.gpu<=r.j.available],['Current water capacity',r.balance>=0],['Leak evidence',!r.leakHigh],['Community reserve',s.community==='normal'],['Full job window',!r.projected],['Alternative placement',s.alt]].map(x=>`<div class="setting-row"><div><b>${x[0]}</b><span>${x[1]?'Constraint satisfied':'Constraint requires action'}</span></div><span class="tag ${x[1]?'green':'red'}">${x[1]?'PASS':'FAIL'}</span></div>`).join('')}</div></section></div><section class="card section-gap"><div class="card-head"><div><h2>Workload queue</h2><p>Click any Job ID to re-evaluate</p></div></div>${jobsTable()}</section>`}
    function reports(){const reports=[['Daily Water Operations','Flow, tank, losses, reuse and scheduler actions for the selected day.','daily'],['Monthly Efficiency','Fleet WUE, reclaimed ratio and potable reduction by site.','monthly'],['Leak & Anomaly Register','All detected residuals, sensor evidence and maintenance response.','leaks'],['Scheduler Decision Log','Workload decisions with water risk, constraints and outcomes.','scheduler']];return pageHead('Reports','Operational records and downloadable monitoring summaries')+`<div class="grid3">${reports.map(r=>`<article class="card report-card"><h3>${r[0]}</h3><p>${r[1]}</p><button class="btn primary" data-report="${r[2]}">Download CSV</button></article>`).join('')}</div><section class="card section-gap"><div class="card-head"><div><h2>Recent generated reports</h2><p>Local demonstration records</p></div></div><table><thead><tr><th>Report</th><th>Period</th><th>Sites</th><th>Generated</th><th>Status</th></tr></thead><tbody><tr><td>Daily Water Operations</td><td>Today</td><td>4</td><td>08:00 MYT</td><td><span class="tag green">Ready</span></td></tr><tr><td>September Efficiency</td><td>Sep 2026</td><td>4</td><td>Oct 01</td><td><span class="tag green">Ready</span></td></tr><tr><td>Leak Investigation Register</td><td>Last 30 days</td><td>4</td><td>Today</td><td><span class="tag blue">Updated</span></td></tr></tbody></table></section>`}
    function cases(){return pageHead('Cases & Alerts','Operational alerts, investigations and simulated scheduler test cases')+`<div class="filters" style="margin-bottom:8px"><button class="btn ${state.caseTab==='alerts'?'active':''}" data-case-tab="alerts">Alerts & investigations</button><button class="btn ${state.caseTab==='tests'?'active':''}" data-case-tab="tests">Test Lab · 24 cases</button></div>${state.caseTab==='alerts'?alertsView():testsView()}`}
    function alertsView(){return`<section class="card"><div class="card-head"><div><h2>Active operations cases</h2><p>Click status to advance the case workflow</p></div><span>${state.alertStatus.filter(x=>x!=='Resolved').length} open items</span></div><table><thead><tr><th>Severity</th><th>Type</th><th>Site</th><th>Summary</th><th>Owner</th><th>Status</th><th>Action</th></tr></thead><tbody>${alerts.map((a,i)=>`<tr><td><span class="tag ${a.sev==='Critical'?'red':a.sev==='High'?'amber':'blue'}">${a.sev}</span></td><td>${a.type}</td><td>${a.site}</td><td>${a.summary}</td><td>${a.owner}</td><td>${state.alertStatus[i]}</td><td><button class="btn" data-alert="${i}">${state.alertStatus[i]==='Resolved'?'Reopen':'Advance'}</button></td></tr>`).join('')}</tbody></table></section>`}
    function testsView(){const shown=tests.filter(x=>state.filter==='ALL'||x.expect===state.filter),pass=[...state.tests.values()].filter(x=>x.pass).length,fail=state.tests.size-pass;return`<section class="card"><div class="card-head"><div><h2>Scheduler scenario test lab</h2><p>Load any case into the Scheduler for a complete walkthrough</p></div><span>Passed <b class="pass">${pass}</b> · Failed <b class="fail">${fail}</b> · Coverage <b>${Math.round(state.tests.size/tests.length*100)}%</b></span></div><div class="test-toolbar"><div class="filters">${['ALL','RUN NOW','DELAY','MOVE SITE','LIMIT LOAD','ESCALATE'].map(f=>`<button class="btn ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div><button class="btn" id="clear-tests">Clear</button> <button class="btn primary" id="run-tests">Run all 24 tests</button></div></div><div class="test-scroll"><table><thead><tr><th>ID</th><th>Simulated condition</th><th>Workload</th><th>Expected</th><th>Actual result</th><th>Walkthrough</th></tr></thead><tbody>${shown.map(t=>{const rr=state.tests.get(t.id);return`<tr class="${state.activeTest===t.id?'loaded':''}"><td><b>${t.id}</b></td><td>${t.name}</td><td>${jobs[t.job].type}</td><td><span class="tag blue">${t.expect}</span></td><td>${rr?`<span class="${rr.pass?'pass':'fail'}">${rr.pass?'PASS':'FAIL'} · ${rr.actual}</span>`:'Not run'}</td><td><button class="btn" data-test="${t.id}">Load & inspect</button></td></tr>`}).join('')}</tbody></table></div></section>`}
    function settings(){const s=state.settings;return pageHead('Settings','Water-risk thresholds and cooling control policies')+`<div class="grid2"><section class="card"><div class="card-head"><div><h2>Scheduler thresholds</h2><p>Used by simulation and test cases</p></div></div><div class="setting-row"><div><b>Water risk watch threshold</b><span>Risk score that triggers additional monitoring</span></div><input id="set-risk" type="number" min="1" max="99" value="${s.riskWatch}"></div><div class="setting-row"><div><b>Minimum tank reserve</b><span>Flexible workload safety threshold</span></div><input id="set-tank" type="number" min="10" max="80" value="${s.minTank}"></div><div class="setting-row"><div><b>Leak residual threshold</b><span>Actual minus expected makeup flow</span></div><input id="set-leak" type="number" min="100" max="3000" value="${s.leakResidual}"></div></section><section class="card"><div class="card-head"><div><h2>Cooling control</h2><p>Automatic dry-run eligibility</p></div></div><div class="setting-row"><div><b>Dry-run ambient threshold</b><span>Maximum ambient temperature for dry cooling</span></div><input id="set-dry" type="number" min="20" max="35" value="${s.dryTemp}"></div><div class="setting-row"><div><b>Default cooling control</b><span>Mode used when the dashboard loads</span></div><select id="set-mode"><option>AUTO</option><option>HYBRID</option><option>DRY RUN</option><option>WET</option></select></div><div style="padding:12px"><button class="btn primary" id="save-settings">Save settings locally</button></div></section></div>`}
    function render(){el('nav').innerHTML=pages.map(p=>`<button class="${state.page===p[0]?'active':''}" data-page="${p[0]}"><span class="ico">${p[1]}</span>${p[2]}</button>`).join('');const views={overview,sites:sitesPage,monitoring,analytics,scheduler,reports,cases,settings};el('app').innerHTML=views[state.page]();bind()}
    function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{state.site=b.dataset.site;state.sim=null;state.activeTest=null;render()});document.querySelectorAll('.site-select').forEach(s=>s.onchange=()=>{state.site=s.value;state.sim=null;render()});document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{state.job=b.dataset.job;state.page='scheduler';render()});document.querySelectorAll('[data-cooling]').forEach(b=>b.onclick=()=>{state.cooling=b.dataset.cooling;render()});document.querySelectorAll('[data-sim]').forEach(c=>c.oninput=()=>{if(!state.sim)state.sim={...site()};let v=c.value;if(['temp','tank','reuse','makeup'].includes(c.dataset.sim))v=+v;if(c.dataset.sim==='alt')v=v==='true';state.sim[c.dataset.sim]=v;state.activeTest=null;render()});const reset=el('reset-sim');if(reset)reset.onclick=()=>{state.sim=null;state.activeTest=null;render()};const dry=el('switch-dry');if(dry)dry.onclick=()=>{state.cooling='DRY RUN';state.page='monitoring';render();toast('Dry Run mode applied to the selected site')};document.querySelectorAll('[data-case-tab]').forEach(b=>b.onclick=()=>{state.caseTab=b.dataset.caseTab;render()});document.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>{const i=+b.dataset.alert;state.alertStatus[i]=state.alertStatus[i]==='Resolved'?'Open':state.alertStatus[i]==='Open'?'Investigating':'Resolved';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>loadTest(b.dataset.test));const run=el('run-tests');if(run)run.onclick=runTests;const clear=el('clear-tests');if(clear)clear.onclick=()=>{state.tests.clear();state.activeTest=null;render()};document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>download(b.dataset.report));const save=el('save-settings');if(save)save.onclick=saveSettings}
    function loadTest(id){const q=tests.find(x=>x.id===id);state.sim={...site(),temp:q.temp,tank:q.tank,reuse:q.reuse,makeup:q.makeup,community:q.community,leak:q.leak,alt:q.alt,future:q.future};state.job=q.job;state.activeTest=id;const actual=evaluate(state.sim,q.job).decision;state.tests.set(id,{actual,pass:actual===q.expect});state.page='scheduler';render();toast(`${id} loaded: ${actual}`)}
    function runTests(){tests.forEach(q=>{const x={...site(),...q};const actual=evaluate(x,q.job).decision;state.tests.set(q.id,{actual,pass:actual===q.expect})});render();toast(`${[...state.tests.values()].filter(x=>x.pass).length}/24 test cases passed`)}
    function download(kind){const rows=[['Report','Site','Metric','Value'],[kind,site().id,'Tank Level',site().tank+'%'],[kind,site().id,'Reuse Ratio',site().reuse+'%'],[kind,site().id,'WUE',site().wue+' L/kWh']];const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`aquashift-${kind}.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV report downloaded')}
    function saveSettings(){state.settings={dryTemp:+el('set-dry').value,riskWatch:+el('set-risk').value,leakResidual:+el('set-leak').value,minTank:+el('set-tank').value};state.cooling=el('set-mode').value;localStorage.setItem('aqua-settings',JSON.stringify(state.settings));toast('Settings saved locally')}
    function toast(msg){const t=el('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
    el('refresh').onclick=()=>{render();toast('Dashboard refreshed')};el('search').onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.toLowerCase(),found=Object.entries(sites).find(([,s])=>(s.id+s.place+s.code).toLowerCase().includes(q));if(found){state.site=found[0];state.page='sites'}else{state.page='cases';state.caseTab='tests'}render()}};render();
  </script>
</body>
</html>
